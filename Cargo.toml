[package]
name = "sabotage-at-t-minus"
version = "0.6.0"
edition = "2024"
description = "A game built with the Bevy engine."
publish = false

[dependencies]
# Bevy's defaults bundle the whole 3D stack (PBR, glTF, anti-aliasing, morph
# targets, KTX2/zstd) plus platform extras this game never touches. That was
# most of the wasm download, so we spell out what we actually use.
#
# Deliberately absent, and why:
#   3d / bevy_pbr / bevy_gltf  — this is a 2D game
#   scene                      — no scene assets; nothing is deserialised
#   bevy_gilrs / gamepad       — keyboard and mouse only
#   sysinfo_plugin             — only logged a SystemInfo line at startup
#   bevy_clipboard             — no text input anywhere
#   sprite_picking/mesh_picking— only the UI needs hit-testing
#   bevy_post_process          — no bloom, no tonemapping stack
bevy = { version = "0.19", default-features = false, features = [
  # App scaffolding
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  "reflect_auto_register",
  # Windowing and input
  "bevy_winit",
  "custom_cursor",
  "default_font",
  "x11",
  "wayland",
  "webgl2",
  # 2D rendering
  "2d_api",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite_render",
  "png",
  # UI. `ui_picking` is what makes `Interaction` fire on the menu buttons.
  "ui_api",
  "bevy_ui_render",
  "bevy_picking",
  "ui_picking",
  # Audio
  "bevy_audio",
  "vorbis",
] }
bevy_rapier2d = "0.35"
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
# `cargo run --features dev` — hot-ish iteration: Bevy links dynamically so
# only this crate is relinked on each edit. Never enable it for shipping builds.
# `bevy_gizmos_render` is what draws Rapier's collider wireframes; it is not
# in the base feature set because nothing in a shipping build uses gizmos.
dev = ["bevy/dynamic_linking", "bevy/bevy_dev_tools", "bevy/bevy_gizmos_render"]

# Our own code is worth optimising a little in dev; dependencies (Bevy, wgpu)
# are optimised fully, since we recompile them approximately never.
[profile.dev]
opt-level = 1
# The default `rust-lld` linker, fed incremental object files that reference a
# dependency's shared-generic monomorphisations, can drop those as "undefined
# hidden symbol" at link time (notably bevy_rapier2d's `register_required_
# components`). It surfaces only after incremental churn, never on a clean
# build. Turning incremental off makes every local build a clean one; the cost
# is negligible since this crate is tiny and dependencies are never built
# incrementally anyway.
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# Web builds pay for every byte of download, so trade a little speed for size.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
